name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff
      - name: Run ruff
        run: ruff check backend || true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio cryptography
      - name: Run tests
        run: |
          pytest -q backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: "testsecret"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          RAZORPAY_KEY_ID: rzp_test_mock
          RAZORPAY_KEY_SECRET: mock_secret
          RAZORPAY_PLAN_PRO_ID: plan_pro
          GROQ_API_KEY: mock_groq

  long-run:
    name: Long Iteration Mock Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio cryptography
      - name: Run long-iteration tests (configurable)
        run: |
          ITERATIONS=${{ env.ITERATIONS || 50 }}
          echo "Starting ${ITERATIONS} iterations of pytest..."
          for i in $(seq 1 ${ITERATIONS}); do
            echo "Iteration $i"
            pytest -q backend/tests || exit 1
          done
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: "testsecret"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          RAZORPAY_KEY_ID: rzp_test_mock
          RAZORPAY_KEY_SECRET: mock_secret
          RAZORPAY_PLAN_PRO_ID: plan_pro
          GROQ_API_KEY: mock_groq
