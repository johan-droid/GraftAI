name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check backend

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests/unit -q
      - run: python -m pytest backend/tests/integration -q

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install native binary for CI platform (lockfile only has Windows)
        run: npm install --no-save lightningcss-linux-x64-gnu
        working-directory: frontend
      - name: Build
        run: npm run build 2>&1 | tail -50
        working-directory: frontend

  docs-links:
    name: Docs Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical docs exist
        run: |
          test -f README.md
          test -f docs/README.md
          test -f docs/architecture/overview.md
          test -f docs/development/local-setup.md
          test -f docs/deployment/vercel.md
          test -f docs/deployment/render.md
          test -f docs/api/overview.md
          test -f docs/audits/repository-audit.md
      - name: No dangling local doc links
        run: |
          broken=0
          for f in README.md docs/README.md docs/architecture/overview.md docs/development/local-setup.md docs/deployment/vercel.md docs/deployment/render.md docs/api/overview.md docs/audits/repository-audit.md; do
            dir=$(dirname "$f")
            grep -o '](\./[^)]*)\|]([^)/][^)]*\.md[^)]*)' "$f" | sed 's/^](//;s/)$//' | while read -r link; do
              link="${link%%#*}"
              case "$link" in http*|"") continue;; esac
              if [ ! -e "$dir/$link" ]; then echo "BROKEN: $f -> $link"; exit 1; fi
            done || broken=1
          done
          exit $broken

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-typecheck, frontend-build, docs-links]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
