[pytest]
# Single canonical pytest config (root). Backend pytest.ini removed in Phase 5.
# Run from repo root: python -m pytest -q
asyncio_mode = auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --tb=short
    --strict-markers

# Register common markers used in the repo
markers =
    integration: integration tests (require database)
    api: api tests
    unit: unit tests
    ai: ai-related unit tests
    slow: slow tests
