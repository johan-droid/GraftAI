version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: graftai
      POSTGRES_PASSWORD: graftai_password
      POSTGRES_DB: graftai_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://graftai:graftai_password@db/graftai_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: testsecret
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
