name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check backend --exit-zero

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install native binary for CI platform (lockfile only has Windows)
        run: npm install --no-save lightningcss-linux-x64-gnu
        working-directory: frontend
      - name: Debug — versions & native modules
        run: |
          node --version
          npm --version
          ls -la node_modules/lightningcss* 2>/dev/null || true
          node -e "try{require('lightningcss').browserslistToTargets;}catch(e){console.error('lightningcss load failed:',e.message)}"
        working-directory: frontend
        continue-on-error: true
      - name: Lint
        run: npm run lint
        working-directory: frontend
        continue-on-error: true
      - name: Build
        run: npx next build --webpack
        working-directory: frontend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
