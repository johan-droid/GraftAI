[tool.poetry]
name = "graftai-backend"
version = "1.0.0"
description = "Backend for GraftAI — AI-powered scheduling platform"
authors = ["GraftAI Team"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.110.0"
uvicorn = {version = ">=0.29.0", extras = ["standard"]}
pydantic = {version = ">=2.10,<3", extras = ["email"]}
bleach = ">=6.1.0"
pytz = ">=2024.1"
aiosqlite = ">=0.20.0"
asyncpg = ">=0.29.0"
sqlalchemy = {version = ">=2.0.0", extras = ["asyncio"]}
alembic = ">=1.13.0"
redis = ">=5.0.0"
pyjwt = ">=2.10.0"
python-jose = {version = ">=3.0.0", extras = ["cryptography"]}
cryptography = ">=43.0.0"
langchain-openai = ">=0.1.0,<2"
openai = ">=1.0.0,<3"
langchain-pinecone = ">=0.2.13"
pyyaml = ">=6.0.1,<7.0"
python-dotenv = ">=1.0.1"
python-dateutil = ">=2.9.0"
httpx = ">=0.28.1"
authlib = ">=1.2.0"
pyotp = ">=2.9.0"
caldav = ">=1.3.6"
msal = ">=1.31.0"
google-auth = ">=2.34.0"
google-auth-oauthlib = ">=1.2.1"
google-api-python-client = ">=2.142.0"
groq = ">=0.4.0"
python-multipart = ">=0.0.18"
arq = ">=0.25.0"
boto3 = ">=1.34.0"
jinja2 = ">=3.1.0"
gunicorn = ">=21.2.0"
sentry-sdk = {version = ">=2.10.0", extras = ["fastapi", "sqlalchemy"]}
stripe = ">=11.0.0"
razorpay = ">=1.4.2"
msgpack = ">=1.1.0"
resend = ">=2.4.0"
psycopg2-binary = ">=2.9.7"
llama-index = ">=0.11.0"
prometheus-client = ">=0.20.0"
celery = ">=5.3.0"
uvloop = {version = ">=0.20.0", markers = "sys_platform != 'win32'"}

[tool.poetry.dev-dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=1.3.0"
pytest-cov = ">=7.1.0"
black = "^24.0.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and flake8-bugbear (B) rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # numpy-specific rules
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert detected (allowed in tests)
    "S311",   # standard pseudo-random generators are not suitable for cryptographic purposes
    "S608",   # possible SQL injection (false positives in SQLAlchemy)
    "COM812", # missing trailing comma (handled by formatter)
    "ISC001", # implicitly concatenated string literals on one line (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"tests/*" = ["S101", "S311", "S608"]  # test-specific rules
"migrations/*" = ["N999"]  # migration naming
"scripts/*" = ["T20", "S603"]  # scripts can use subprocess and print

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["graftai"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "sqlalchemy>=2.0.49",
]
